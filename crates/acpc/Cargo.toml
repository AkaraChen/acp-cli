[package]
name = "acpc"
# Tracks the Codex workspace version so the embedded TUI sees a matching
# server version; acpc's own release version lives in main.rs.
version.workspace = true
edition.workspace = true
license = "MIT"
workspace = "../../third_party/codex/codex-rs"
publish = false

[[bin]]
name = "acpc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
acp-bridge = { path = "../acp-bridge" }
acp-client = { path = "../acp-client" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-tui = { workspace = true }
codex-utils-absolute-path = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
