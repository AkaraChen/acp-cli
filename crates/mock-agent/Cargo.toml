[package]
name = "acpc-mock-agent"
version = "0.1.0"
edition.workspace = true
license = "MIT"
workspace = "../../third_party/codex/codex-rs"
publish = false

[[bin]]
name = "acpc-mock-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "=5.0.0", features = ["stdio"] }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-std"] }
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync"] }
