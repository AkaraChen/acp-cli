<!doctype html>
<!-- Source for assets/og.png. Render with tools/og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #000; }
  body {
    position: relative;
    overflow: hidden;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    font-family: "Geist", sans-serif;
    color: #ededed;
    background-image:
      linear-gradient(#ffffff0d 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0d 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
  }
  .mark {
    font-family: "Geist Mono", monospace;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.02em;
  }
  .mark span { color: #52a8ff; margin-right: 10px; }
  h1 {
    margin-top: 44px;
    font-size: 72px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.045em;
    max-width: 900px;
  }
  .term {
    margin-top: 40px;
    align-self: flex-start;
    font-family: "Geist Mono", monospace;
    font-size: 22px;
    line-height: 1.6;
    padding: 14px 22px;
    background: #0a0a0a;
    border: 1px solid #ffffff24;
  }
  .d { color: #8f8f8f; }
  .g { color: #45d483; }
  .y { color: #f5b74f; }
  .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .icons { display: flex; gap: 22px; }
  .icons i {
    width: 34px;
    height: 34px;
    background: #ededed;
    -webkit-mask: var(--u) center / contain no-repeat;
  }
  .url { font-family: "Geist Mono", monospace; font-size: 24px; color: #a1a1a1; }
</style>
</head>
<body>
  <div class="mark"><span>&gt;_</span>acpc</div>
  <h1>One terminal UI for every coding agent.</h1>
  <div class="term"><span class="g">›</span> /agent <span class="d">→</span> Claude <span class="d">·</span> <span class="y">Bring this conversation</span></div>
  <div class="foot">
    <div class="icons">
      <i style="--u:url(../assets/icons/claude.svg)"></i>
      <i style="--u:url(../assets/icons/codex.svg)"></i>
      <i style="--u:url(../assets/icons/gemini.svg)"></i>
      <i style="--u:url(../assets/icons/copilot.svg)"></i>
      <i style="--u:url(../assets/icons/opencode.svg)"></i>
      <i style="--u:url(../assets/icons/goose.svg)"></i>
      <i style="--u:url(../assets/icons/cursor.svg)"></i>
      <i style="--u:url(../assets/icons/kimi.svg)"></i>
      <i style="--u:url(../assets/icons/qwen.svg)"></i>
    </div>
    <div class="url">acpc.akr.moe</div>
  </div>
</body>
</html>
